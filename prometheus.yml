# prometheus.yml
global:
  scrape_interval: 15s # By default, scrape targets every 15 seconds.

# Attach these labels to any time series or alerts when communicating with
# external systems (federation, remote storage, Alertmanager).
external_labels:
  monitor: 'sorting-system-monitor'

# A scrape configuration containing exactly one endpoint to scrape:
scrape_configs:
  # The job name is added as a label `job=<job_name>` to any timeseries scraped from this config.
  - job_name: 'prometheus'
    # Override the global default and scrape targets from this job every 5 seconds.
    scrape_interval: 5s
    static_configs:
      - targets: ['localhost:9090']

  # Scrape configuration for the Django backend
  - job_name: 'sorting-system-backend'
    # Override the global default and scrape targets every 10 seconds.
    scrape_interval: 10s
    static_configs:
      - targets: ['backend:8000']  # Adjust this to match your backend service address
    metrics_path: '/'  # Django Prometheus exports metrics at the root path

  # Scrape configuration for the React frontend
  # Note: For client-side applications, you'll need to expose metrics through a backend endpoint
  # or use a separate metrics collection service
  - job_name: 'sorting-system-frontend'
    scrape_interval: 10s
    static_configs:
      - targets: ['frontend:3000']  # Adjust this to match your frontend service address
    metrics_path: '/metrics'  # We'll need to create a metrics endpoint in the frontend