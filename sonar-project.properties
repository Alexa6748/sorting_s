sonar.projectKey=sorting_s

sonar.projectName=Sorting System
sonar.projectVersion=1.0

sonar.newCode.referenceBranch=
sonar.modules=frontend,backend

# Frontend module configuration (React/JavaScript)
frontend.sonar.projectBaseDir=frontend
frontend.sonar.sources=src
frontend.sonar.sources.exclusions=**/node_modules/**,**/build/**,**/dist/**,**/coverage/**,**/public/**,**/routes/**,**/styles/**,**/__tests__/**,**/utils/**,**/index.js,**/setupTests.js,**/*.test.js,**/reportWebVitals.js,**/*.css,**/*.scss,**/*.less,**/*.svg
frontend.sonar.tests=src
frontend.sonar.test.inclusions=**/__tests__/**/*.js,**/*.test.js
frontend.sonar.test.exclusions=**/node_modules/**,**/build/**,**/dist/**,**/coverage/**,**/public/**
frontend.sonar.javascript.lcov.reportPaths=coverage/lcov.info
frontend.sonar.testExecutionReportPaths=test-report.xml

# Backend module configuration (Python/Django)
backend.sonar.projectBaseDir=sorting_system
backend.sonar.sources=.
backend.sonar.sources.inclusions=**/*.py
backend.sonar.sources.exclusions=**/migrations/**,**/__pycache__/**,**/venv/**,**/node_modules/**,**/htmlcov/**,**/.pytest_cache/**,**/tmp/**,**/temp/**,**/weights/**,**/media/**,**/config*.py,**/templates/**,**/static/**,**/admin.py,**/apps.py,**/models.py,**/manage.py,**/tests.py,**/test_*.py,**/*_test.py,**/*tests*/
backend.sonar.tests=.
backend.sonar.test.inclusions=**/tests.py,**/test_*.py,**/*_test.py,**/*tests*/
backend.sonar.test.exclusions=**/migrations/**,**/__pycache__/**,**/venv/**,**/node_modules/**,**/htmlcov/**,**/.pytest_cache/**,**/tmp/**,**/temp/**,**/weights/**,**/media/**,**/config*.py,**/templates/**,**/static/**,**/admin.py,**/apps.py,**/models.py,**/manage.py
backend.sonar.python.coverage.reportPaths=coverage.xml
backend.sonar.python.xunit.skipDetails=false
backend.sonar.coverage.exclusions=**/admin.py,**/apps.py,**/models.py,**/manage.py,**/migrations/**
backend.sonar.python.django.settingsModule=sorting_system.settings
backend.sonar.python.version=3.8,3.9,3.10,3.11