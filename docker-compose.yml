version: '3.8'

services:
  backend:
    build:
      context: ./sorting_system
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./sorting_system:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - backend