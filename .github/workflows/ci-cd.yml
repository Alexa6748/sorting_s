name: Sorting System CI/CD

on:
  push:
    branches: [ "main", "monitoring", "sonarqube"]
  pull_request:
    branches: [ "main", "monitoring", "sonarqube"]

jobs:
  test-and-sonarqube:
    name: Test and SonarQube Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: |
          npm ci

      - name: Run frontend tests with coverage for SonarQube
        working-directory: ./frontend
        run: |
          npm run test:sonar -- --watchAll=false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0 libsm6 libxrender1 libxext6

      - name: Install Python dependencies
        working-directory: ./sorting_system
        run: |
          python -m pip install --upgrade pip
          # Install CPU version of PyTorch first from PyTorch wheels
          pip install torch==2.0.1+cpu torchvision==0.15.2+cpu -f https://download.pytorch.org/whl/torch_stable.html
          # Create requirements file without torch dependencies
          cat requirements.txt | grep -v "torch" > requirements-ci.txt
          # Install remaining dependencies
          pip install -r requirements-ci.txt
          # Install coverage tool
          pip install coverage
          # Clean up
          rm requirements-ci.txt

      - name: Setup Django environment
        working-directory: ./sorting_system
        run: |
          # Create media directory if it doesn't exist
          mkdir -p media/uploads media/debug
          # Create .env file with required environment variables
          echo "SECRET_KEY=${{ secrets.SECRET_KEY }}" > .env
          echo DEBUG=True >> .env

      - name: Check Django configuration
        working-directory: ./sorting_system
        run: |
          python manage.py check

      - name: Run Django migrations
        working-directory: ./sorting_system
        run: |
          python manage.py migrate

      - name: Run backend tests with coverage
        working-directory: ./sorting_system
        run: |
          coverage run manage.py test
          coverage xml -o coverage.xml
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          DEBUG: True

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONARQUBE_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONARQUBE_HOST }}
        
      - name: SonarQube Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONARQUBE_TOKEN }}

  docker-compose-build:
    runs-on: ubuntu-latest
    needs: [test-and-sonarqube]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/monitoring' || github.ref == 'refs/heads/sonarqube'
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        lfs: true

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Login to DockerHub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Extract metadata for backend
      id: meta-backend
      uses: docker/metadata-action@v4
      with:
        images: ${{ secrets.DOCKERHUB_USERNAME }}/sorting_s
        tags: |
          type=ref,event=branch
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push backend image
      uses: docker/build-push-action@v4
      with:
        context: ./sorting_system
        file: ./sorting_system/Dockerfile
        push: true
        tags: ${{ steps.meta-backend.outputs.tags }}
        labels: ${{ steps.meta-backend.outputs.labels }}

    - name: Extract metadata for frontend
      id: meta-frontend
      uses: docker/metadata-action@v4
      with:
        images: ${{ secrets.DOCKERHUB_USERNAME }}/sorting_s_frontend
        tags: |
          type=ref,event=branch
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push frontend image
      uses: docker/build-push-action@v4
      with:
        context: ./frontend
        file: ./frontend/Dockerfile
        push: true
        tags: ${{ steps.meta-frontend.outputs.tags }}
        labels: ${{ steps.meta-frontend.outputs.labels }}

  deploy-to-kubernetes:
    runs-on: ubuntu-latest
    needs: [docker-compose-build]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/monitoring' || github.ref == 'refs/heads/sonarqube'
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: 'latest'

    - name: Configure Kubernetes cluster access
      uses: azure/k8s-set-context@v3
      with:
        method: kubeconfig
        kubeconfig: ${{ secrets.KUBECONFIG }}

    - name: Deploy backend to Kubernetes
      run: |
        kubectl set image deployment/backend backend=${{ secrets.DOCKERHUB_USERNAME }}/sorting_s:${{ github.ref_name }}

    - name: Deploy frontend to Kubernetes
      run: |
        kubectl set image deployment/frontend frontend=${{ secrets.DOCKERHUB_USERNAME }}/sorting_s_frontend:${{ github.ref_name }}